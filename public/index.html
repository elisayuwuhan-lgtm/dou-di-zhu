<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three Friends Card Room</title><style>
*{box-sizing:border-box}body{margin:0;background:#103e35;color:#f9f4e4;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:30px}button,input{font:inherit;padding:12px;border:0;border-radius:9px}button{background:#f1cb80;color:#24332b;cursor:pointer;font-weight:600}button:disabled{opacity:.4;cursor:default}input{max-width:100%;margin:4px}section{background:#ffffff0d;border:1px solid #ffffff22;border-radius:16px;padding:18px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.card{background:#fffaf0;color:#17251f;width:62px;height:90px;padding:5px;box-shadow:0 3px 5px #0004;white-space:normal;font-size:18px}.red{color:#bd273b}.selected{transform:translateY(-9px);outline:3px solid #eec76e}.hand{display:flex;gap:5px;flex-wrap:wrap;padding-top:14px}.muted{color:#bdd1c7}#notice{color:#ffdd9e}small{display:block;margin-top:8px}#table{min-height:140px} .player{padding:12px;background:#ffffff12;border-radius:10px}.active{outline:2px solid #f1cb80}</style><main><h1>♠ Three Friends Card Room</h1><p class="muted">Dou Di Zhu · private table · no wagering</p><div id="join"><section><input id="name" placeholder="Your nickname" maxlength="24"><input id="code" placeholder="Room code (to join)"><div class="row"><button id="create">Create room</button><button id="enter">Join room</button></div></section></div><div id="game" hidden><div class="row"><strong id="room"></strong><button id="copy">Copy invitation link</button></div><section><div id="players" class="row"></div><p id="status"></p><div class="row"><button id="deal">Deal / new round</button><button id="landlord">Become landlord</button></div></section><section id="table"><strong>Table</strong><div id="kitty" class="muted"></div><div id="last" class="hand"></div></section><section><strong>Your hand</strong><div id="hand" class="hand"></div><div class="row" style="margin-top:18px"><button id="play">Play selected</button><button id="pass">Pass</button><button id="sort">Sort cards</button><button id="clear">Clear selection</button></div></section><section><strong>Round history</strong><div id="log"></div></section></div><p id="notice" role="status"></p><small class="muted">Virtual tabletop: agree on valid combinations and bidding with your friends. The server enforces turns and card ownership, not combination rules.</small></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io();let state,selected=new Set(),sorted=true;const action=(type,ids)=>socket.emit('action',{type,ids});$('code').value=new URLSearchParams(location.search).get('room')||'';$('create').onclick=()=>socket.emit('join',{name:$('name').value,code:''});$('enter').onclick=()=>socket.emit('join',{name:$('name').value,code:$('code').value});$('copy').onclick=async()=>{let u=new URL(location.href);u.searchParams.set('room',state.code);try{await navigator.clipboard.writeText(u.href);$('notice').textContent='Invitation copied'}catch{$('notice').textContent=u.href}};for(let t of ['deal','landlord','pass'])$(t).onclick=()=>action(t);$('play').onclick=()=>action('play',[...selected]);$('sort').onclick=()=>{sorted=!sorted;render()};$('clear').onclick=()=>{selected.clear();render()};socket.on('notice',m=>$('notice').textContent=m);socket.on('disconnect',()=>{$('notice').textContent='Disconnected. Refresh and rejoin the room.'});socket.on('state',s=>{state=s;selected=new Set([...selected].filter(id=>s.hand.some(c=>c.id===id)));render()});function card(c,click){let b=document.createElement(click?'button':'div');b.className='card '+(['♥','♦'].includes(c.s)||c.id==='BJ'?'red':'')+(click&&selected.has(c.id)?' selected':'');b.textContent=c.r+' '+c.s;if(click)b.onclick=()=>{selected.has(c.id)?selected.delete(c.id):selected.add(c.id);render()};return b}function render(){let s=state;if(!s)return;$('join').hidden=true;$('game').hidden=false;$('room').textContent='Room: '+s.code;$('players').replaceChildren(...s.players.map(p=>{let e=document.createElement('div');e.className='player '+(s.turn===p.id?'active':'');e.textContent=p.name+(p.id===s.me?' (you)':'')+(p.id===s.landlord?' · Landlord':'')+' · '+p.count+' cards';return e}));$('status').textContent=s.winner||({waiting:'Waiting for three players',choose:'Agree on a landlord, then claim the role',play:s.turn===s.me?'Your turn':'Waiting for '+s.players.find(p=>p.id===s.turn)?.name}[s.phase]);$('deal').disabled=s.players.length!==3||!['waiting','ended'].includes(s.phase);$('landlord').disabled=s.phase!=='choose';$('play').disabled=s.phase!=='play'||s.turn!==s.me||!selected.size;$('pass').disabled=s.phase!=='play'||s.turn!==s.me||!s.last;$('kitty').textContent=s.kitty.length?'Landlord cards: '+s.kitty.map(c=>c.r+c.s).join(' '):'';$('last').replaceChildren(...(s.last?s.last.cards.map(c=>card(c,false)):[]));let h=[...s.hand];if(sorted)h.sort((a,b)=>b.v-a.v||a.s.localeCompare(b.s));$('hand').replaceChildren(...h.map(c=>card(c,true)));$('log').replaceChildren(...s.log.map(l=>{let e=document.createElement('div');e.textContent=l;return e}));}
</script></html>
